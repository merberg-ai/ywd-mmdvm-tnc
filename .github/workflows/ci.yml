name: ywd-mmdvm-tnc-ci

on:
  push:
    branches: [main, dev, "firmware/**", "runtime/**", "checkpoint/**"]
  pull_request:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify qualified core pin
        run: test "$(git -C vendor/ywd-1278 rev-parse HEAD)" = "c28c46c3478d7931af611923c92cd8f692a00858"

      - name: Install product with bundled frozen runtime
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-deps .
          cd /tmp
          python -c 'import ywdtnc.engine, ywd1278.kiss.sustained, ywd1278.modem.tx_owner, ywd1278.service.tnc_runtime; print("FWM3_PRODUCT_ONLY_RUNTIME_IMPORT=PASS")'
          if python -m pip show ywd-1278 >/dev/null 2>&1; then echo "unexpected separate ywd-1278 distribution" >&2; exit 1; fi
          echo FWM3_SEPARATE_YWD1278_DISTRIBUTION_INSTALLED=NO

      - name: Public release host contract
        run: bash scripts/check-public-polish.sh

      - name: Firmware updater safety contract
        run: bash scripts/check-firmware-update-tooling.sh

      - name: Firmware profile remains hardware inert
        run: ywd-tnc-fw --profile firmware/product-ax25r4.json show

      - name: Framework self-test remains RF inert
        run: ywd-tncd --config config/ywd-mmdvm-tnc.example.toml --framework-self-test

  runtime-inrepo-equivalence:
    if: startsWith(github.ref, 'refs/heads/runtime/') || startsWith(github.ref, 'refs/heads/checkpoint/runtime-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify byte-identical in-repo runtime and HAT support
        run: bash scripts/check-runtime-inrepo-migration.sh
      - name: Prove product-only wheel installation
        run: |
          python -m venv /tmp/fwm3-venv
          /tmp/fwm3-venv/bin/python -m pip install --upgrade pip setuptools wheel
          /tmp/fwm3-venv/bin/python -m pip install --no-deps .
          cd /tmp
          /tmp/fwm3-venv/bin/python -c 'import importlib.metadata as m; import ywdtnc, ywdtnc.engine, ywd1278.kiss.sustained, ywd1278.modem.tx_owner, ywd1278.service.tnc_runtime; assert m.version("ywd-mmdvm-tnc") == ywdtnc.__version__; print("FWM3_PRODUCT_ONLY_WHEEL_INSTALL=PASS")'
          if /tmp/fwm3-venv/bin/python -m pip show ywd-1278 >/dev/null 2>&1; then echo "unexpected separate ywd-1278 distribution" >&2; exit 1; fi
          echo FWM3_SEPARATE_YWD1278_DISTRIBUTION_INSTALLED=NO

  firmware-inrepo-equivalence:
    if: startsWith(github.ref, 'refs/heads/firmware/') || startsWith(github.ref, 'refs/heads/checkpoint/firmware-')
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
    steps:
      - name: Install qualified firmware build environment
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates python3 passwd util-linux sudo \
            git=1:2.47.3-0+deb13u1 \
            make=4.4.1-2 \
            gcc-arm-none-eabi=15:14.2.rel1-1 \
            binutils-arm-none-eabi=2.44-3+23+b1 \
            libnewlib-dev=4.5.0.20241231-1 \
            libnewlib-arm-none-eabi=4.5.0.20241231-1 \
            libstdc++-arm-none-eabi-dev=15:14.2.rel1-1+29 \
            libstdc++-arm-none-eabi-newlib=15:14.2.rel1-1+29
          test "$(arm-none-eabi-gcc -dumpfullversion)" = "14.2.1"
          test "$(dpkg-query -W -f='${Version}' git)" = "1:2.47.3-0+deb13u1"
          test "$(dpkg-query -W -f='${Version}' make)" = "4.4.1-2"
          test "$(dpkg-query -W -f='${Version}' gcc-arm-none-eabi)" = "15:14.2.rel1-1"
          test "$(dpkg-query -W -f='${Version}' binutils-arm-none-eabi)" = "2.44-3+23+b1"
          test "$(dpkg-query -W -f='${Version}' libnewlib-dev)" = "4.5.0.20241231-1"
          test "$(dpkg-query -W -f='${Version}' libnewlib-arm-none-eabi)" = "4.5.0.20241231-1"
          test "$(dpkg-query -W -f='${Version}' libstdc++-arm-none-eabi-dev)" = "15:14.2.rel1-1+29"
          test "$(dpkg-query -W -f='${Version}' libstdc++-arm-none-eabi-newlib)" = "15:14.2.rel1-1+29"
          arm-none-eabi-gcc --version | head -1
          useradd --create-home --shell /bin/bash fwbuild

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify exact in-repo migration inputs and production cutover
        run: bash scripts/check-firmware-inrepo-migration.sh

      - name: Hand checkout to unprivileged firmware user
        run: chown -R fwbuild:fwbuild "$GITHUB_WORKSPACE"

      - name: Build qualified reference through frozen YWD-1278 path
        run: |
          runuser -u fwbuild -- python3 vendor/ywd-1278/firmware/build-packet-rssi-ywd1278.py --jobs 2
          cp vendor/ywd-1278/firmware/out/0c-p2-rssi-ax25r4-stm32f103-simplex-adf7021-14.7456tcxo-8mhz-hse/MMDVM_HS_Hat-YWD-1278-AX25R4-v0.1.0-alpha1-7ff74ed-hse8m.bin /tmp/ywd-1278-reference.bin

      - name: Build qualified candidate directly from in-repo inputs
        run: |
          rm -rf firmware/out
          runuser -u fwbuild -- python3 firmware/build-qualified-inrepo.py --jobs 2
          cp firmware/out/0c-p2-rssi-ax25r4-stm32f103-simplex-adf7021-14.7456tcxo-8mhz-hse/MMDVM_HS_Hat-YWD-1278-AX25R4-v0.1.0-alpha1-7ff74ed-hse8m.bin /tmp/direct-inrepo.bin

      - name: Build through production guided firmware wrapper
        run: |
          rm -rf firmware/out
          YWD_TNC_INSTALLER_BUILD=1 \
          YWD_TNC_BUILD_USER=fwbuild \
          YWD_TNC_FIRMWARE_BUILD_JOBS=2 \
            bash firmware/build.sh

      - name: Require three-way byte-identical qualified artifact
        run: |
          production=firmware/out/0c-p2-rssi-ax25r4-stm32f103-simplex-adf7021-14.7456tcxo-8mhz-hse/MMDVM_HS_Hat-YWD-1278-AX25R4-v0.1.0-alpha1-7ff74ed-hse8m.bin
          expected=b06fcbf0baa36e865198091cee27c66e1624ef08117ee685253a7a5613c7c616
          cmp /tmp/ywd-1278-reference.bin /tmp/direct-inrepo.bin
          cmp /tmp/direct-inrepo.bin "$production"
          test "$(stat -c %s "$production")" = 59892
          test "$(sha256sum /tmp/ywd-1278-reference.bin | awk '{print $1}')" = "$expected"
          test "$(sha256sum /tmp/direct-inrepo.bin | awk '{print $1}')" = "$expected"
          test "$(sha256sum "$production" | awk '{print $1}')" = "$expected"
          echo FWM2_REFERENCE_VS_DIRECT_INREPO_BYTE_IDENTICAL=PASS
          echo FWM2_DIRECT_VS_PRODUCTION_WRAPPER_BYTE_IDENTICAL=PASS
          echo FWM2_PRODUCTION_BUILD_INREPO_BYTE_IDENTICAL=PASS
          echo FWM2_QUALIFIED_SHA256_MATCH=PASS
          echo FWM2_QUALIFIED_TOOLCHAIN_GCC=14.2.1
          echo FWM2_PRODUCTION_FIRMWARE_BUILD_SOURCE=IN_REPO
          echo HARDWARE_ACCESSED=NO
          echo FLASH_WRITTEN=NO
          echo RF_TRANSMITTED=NO
