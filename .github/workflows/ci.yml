name: ywd-mmdvm-tnc-ci

on:
  push:
    branches: [main, dev, "firmware/**", "checkpoint/**"]
  pull_request:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify qualified core pin
        run: test "$(git -C vendor/ywd-1278 rev-parse HEAD)" = "c28c46c3478d7931af611923c92cd8f692a00858"

      - name: Install pinned core and product
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-deps ./vendor/ywd-1278
          python -m pip install --no-deps -e .

      - name: Public release host contract
        run: bash scripts/check-public-polish.sh

      - name: Firmware profile remains hardware inert
        run: ywd-tnc-fw --profile firmware/product-ax25r4.json show

      - name: Framework self-test remains RF inert
        run: ywd-tncd --config config/ywd-mmdvm-tnc.example.toml --framework-self-test

  firmware-inrepo-equivalence:
    if: startsWith(github.ref, 'refs/heads/firmware/') || startsWith(github.ref, 'refs/heads/checkpoint/firmware-')
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
    steps:
      - name: Install qualified firmware build environment
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates python3 passwd util-linux \
            git=1:2.47.3-0+deb13u1 \
            make=4.4.1-2 \
            gcc-arm-none-eabi=15:14.2.rel1-1 \
            binutils-arm-none-eabi=2.44-3+23+b1 \
            libnewlib-dev=4.5.0.20241231-1 \
            libnewlib-arm-none-eabi=4.5.0.20241231-1 \
            libstdc++-arm-none-eabi-dev=15:14.2.rel1-1+29 \
            libstdc++-arm-none-eabi-newlib=15:14.2.rel1-1+29
          test "$(arm-none-eabi-gcc -dumpfullversion)" = "14.2.1"
          test "$(dpkg-query -W -f='${Version}' git)" = "1:2.47.3-0+deb13u1"
          test "$(dpkg-query -W -f='${Version}' make)" = "4.4.1-2"
          test "$(dpkg-query -W -f='${Version}' gcc-arm-none-eabi)" = "15:14.2.rel1-1"
          test "$(dpkg-query -W -f='${Version}' binutils-arm-none-eabi)" = "2.44-3+23+b1"
          test "$(dpkg-query -W -f='${Version}' libnewlib-dev)" = "4.5.0.20241231-1"
          test "$(dpkg-query -W -f='${Version}' libnewlib-arm-none-eabi)" = "4.5.0.20241231-1"
          test "$(dpkg-query -W -f='${Version}' libstdc++-arm-none-eabi-dev)" = "15:14.2.rel1-1+29"
          test "$(dpkg-query -W -f='${Version}' libstdc++-arm-none-eabi-newlib)" = "15:14.2.rel1-1+29"
          arm-none-eabi-gcc --version | head -1
          useradd --create-home --shell /bin/bash fwbuild

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify exact in-repo migration inputs
        run: bash scripts/check-firmware-inrepo-migration.sh

      - name: Hand build workspace to unprivileged firmware user
        run: chown -R fwbuild:fwbuild "$GITHUB_WORKSPACE"

      - name: Build qualified reference through pinned YWD-1278
        run: |
          runuser -u fwbuild -- python3 vendor/ywd-1278/firmware/build-packet-rssi-ywd1278.py --jobs 2
          cp vendor/ywd-1278/firmware/out/0c-p2-rssi-ax25r4-stm32f103-simplex-adf7021-14.7456tcxo-8mhz-hse/MMDVM_HS_Hat-YWD-1278-AX25R4-v0.1.0-alpha1-7ff74ed-hse8m.bin /tmp/ywd-1278-reference.bin

      - name: Build qualified candidate from in-repo firmware inputs
        run: |
          rm -rf firmware/out
          runuser -u fwbuild -- python3 firmware/build-qualified-inrepo.py --jobs 2

      - name: Require byte-identical qualified artifact
        run: |
          candidate=firmware/out/0c-p2-rssi-ax25r4-stm32f103-simplex-adf7021-14.7456tcxo-8mhz-hse/MMDVM_HS_Hat-YWD-1278-AX25R4-v0.1.0-alpha1-7ff74ed-hse8m.bin
          expected=b06fcbf0baa36e865198091cee27c66e1624ef08117ee685253a7a5613c7c616
          cmp /tmp/ywd-1278-reference.bin "$candidate"
          test "$(stat -c %s "$candidate")" = 59892
          test "$(sha256sum /tmp/ywd-1278-reference.bin | awk '{print $1}')" = "$expected"
          test "$(sha256sum "$candidate" | awk '{print $1}')" = "$expected"
          echo FWM1_REFERENCE_VS_INREPO_BYTE_IDENTICAL=PASS
          echo FWM1_QUALIFIED_SHA256_MATCH=PASS
          echo FWM1_QUALIFIED_TOOLCHAIN_GCC=14.2.1
          echo HARDWARE_ACCESSED=NO
          echo FLASH_WRITTEN=NO
          echo RF_TRANSMITTED=NO
