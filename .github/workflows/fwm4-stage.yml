name: FWM4 updater staging

on:
  push:
    branches: ["firmware/update-tooling"]

permissions:
  contents: write

jobs:
  stage-update-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: firmware/update-tooling
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply deterministic updater transformation
        run: python3 scripts/fwm4-stage-update-tool.py
      - name: Verify updater host contract
        run: bash scripts/check-firmware-update-tooling.sh
      - name: Verify existing public host contract
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-deps .
          bash scripts/check-public-polish.sh
      - name: Commit staged updater cutover
        run: |
          if git diff --quiet; then
            echo FWM4_STAGE_ALREADY_APPLIED=YES
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md pyproject.toml src/ywdtnc/__init__.py \
            firmware/qualified_flash.py firmware/flash_ui.py firmware/accepted-firmware.json \
            firmware/update.sh update-firmware.sh installer/install.sh \
            scripts/check-firmware-update-tooling.sh
          git diff --cached --check
          git commit -m "[fwm4-stage] add accepted-firmware update/reflash tool"
          git push origin HEAD:firmware/update-tooling
