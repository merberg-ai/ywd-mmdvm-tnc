name: dev-ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify qualified core pin
        shell: bash
        run: |
          test "$(git -C vendor/ywd-1278 rev-parse HEAD)" = "c28c46c3478d7931af611923c92cd8f692a00858"

      - name: Install pinned core and product
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-deps ./vendor/ywd-1278
          python -m pip install --no-deps -e .

      - name: Compile product layer
        run: python -m compileall -q src/ywdtnc

      - name: Run modem-only contracts
        run: python -m unittest discover -s tests -v

      - name: Framework self-test is RF inert
        run: ywd-tncd --config config/ywd-mmdvm-tnc.example.toml --framework-self-test
