# YWD-MMDVM-TNC example configuration
# Safe defaults: RF transmission disabled; network listeners loopback-only.
#
# For an explicitly trusted LAN KISS deployment, 0.0.0.0 is accepted only
# when allow_wildcard_bind=true in that same listener section. 0.0.0.0 binds
# every IPv4 interface, so use a host firewall if the machine has any
# untrusted/public interface.

[hardware]
target = "mmdvm-hs-hat-stm32f103-simplex-14.7456-adf7021"

[radio]
device = "/dev/ttyAMA0"
frequency_mhz = 145.050
tx_power = 200
tx_enabled = false

[packet]
baud = 1200
txdelay_ms = 300
persist = 63
slottime_ms = 100

[kiss]
enabled = true
listen = "127.0.0.1"
port = 8001
allow_wildcard_bind = false

[agw]
enabled = true
listen = "127.0.0.1"
port = 8000
allow_wildcard_bind = false
raw_only = true

[firmware]
required_identity = "MMDVM_HS_Hat-YWD-1278-AX25R4-v0.1.0-alpha1 14.7456MHz ADF7021 FW based on CA6JAU GitID #7ff74ed"
allow_automatic_flash = false
