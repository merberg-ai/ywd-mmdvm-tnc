[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ywd-mmdvm-tnc"
version = "0.1.0a15"
description = "Dedicated TCP KISS / AGW raw 1200-baud AX.25 TNC for supported MMDVM_HS HATs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-2.0-or-later"}
authors = [{name = "YWD-MMDVM-TNC contributors"}]
dependencies = []

[project.scripts]
ywd-tncd = "ywdtnc.tncd:main"
ywd-tnc-fw = "ywdtnc.firmware:main"
ywd-tnc-rx-gate = "ywdtnc.rx_gate:main"
ywd-tnc-p2-gate = "ywdtnc.p2_qualification:main"
ywd-tnc-profile = "ywdtnc.profile_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ywdtnc*", "ywd1278*"]
